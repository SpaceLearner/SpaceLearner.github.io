<template id="about"><p>现于腾讯从事通用 Agent 研究，并负责通用智能体模型后训练。北京大学博士，曾在阿里巴巴达摩院开展多模态智能体与具身智能研究。</p><hr class="rule"><h3>研究与教育经历</h3><ul class="timeline"><li><span>CURRENT</span><strong>腾讯 Tencent</strong><br>通用 Agent 研究 · 负责通用智能体模型后训练</li><li><span>PREVIOUSLY</span><strong>阿里巴巴达摩院</strong><br>Research Engineer · 多模态智能体与具身智能研究。RynnBrain 项目负责人之一，参与预训练、Chain-of-Point 推理、VLA 与训练基础设施。<br><a href="https://arxiv.org/html/2602.14979v1#A1" target="_blank" rel="noopener noreferrer">公开贡献说明 ↗</a></li><li><span>2024</span><strong>北京大学</strong> · 博士学位</li><li><span>2019</span><strong>北京理工大学</strong> · 学士学位</li></ul><div class="links"><a href="https://scholar.google.com/citations?user=M-AFBG4AAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Google Scholar ↗</a><a href="https://github.com/SpaceLearner" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div><p class="note" lang="en">Agent in the loop. Human in the loss.</p></template>
<template id="research"><p class="en">TWO DIRECTIONS / ONE RESEARCH MISSION</p><h3>01 · 通用智能体</h3><p class="en">Generalist Agents</p><p>研究通用智能体模型后训练、搜索、工具使用与多步推理，结合强化学习与交互反馈，探索跨任务、跨环境的通用智能体能力。</p><p>代表工作：<a href="#projects/zerosearch" data-open="projects" data-project="zerosearch">ZeroSearch</a></p><hr class="rule"><h3>02 · 物理智能</h3><p class="en">Physical Intelligence</p><p>研究物理世界中的感知、空间理解与推理，结合具身基础模型、视觉语言动作模型与世界建模，让智能从理解走向行动。</p><p>代表工作：<a href="#projects/rynnbrain" data-open="projects" data-project="rynnbrain">RynnBrain、WorldVLA、RynnVLA-001 / 002</a></p><hr class="rule"><p class="note">JGCF 等图学习与推荐系统研究保留为其他研究项目。</p></template>
<template id="projects"><article class="project" data-project="zerosearch"><p class="en">GENERALIST AGENTS</p><h3 tabindex="-1">ZeroSearch</h3><p class="role">共同通讯作者 · Co-corresponding author</p><p>以模拟检索交互训练搜索智能体，通过强化学习探索搜索策略与多步推理。</p><figure class="project-figure"><button type="button" class="figure-open" data-image-title="ZeroSearch · PPO / GRPO 训练框架" data-image-source="https://github.com/Alibaba-NLP/ZeroSearch/blob/main/assets/model.jpg" aria-haspopup="dialog" aria-controls="image-viewer" aria-label="放大ZeroSearch 官方框架图"><img src="./research-assets/zerosearch-model.jpg" alt="ZeroSearch 官方框架图" loading="lazy"><span>查看大图 ↗</span></button><figcaption>项目框架图 · <a href="https://github.com/Alibaba-NLP/ZeroSearch/blob/main/assets/model.jpg" target="_blank" rel="noopener noreferrer">原始项目资料 ↗</a></figcaption></figure><div class="links"><a href="https://arxiv.org/abs/2505.04588" target="_blank" rel="noopener noreferrer">论文 ↗</a><a href="https://github.com/Alibaba-NLP/ZeroSearch" target="_blank" rel="noopener noreferrer">代码 ↗</a></div></article><article class="project" data-project="rynnbrain"><p class="en">PHYSICAL INTELLIGENCE</p><h3 tabindex="-1">RynnBrain</h3><p class="role">项目负责人之一 · Project co-lead</p><p>面向物理世界的开源具身基础模型，结合自我中心感知、时空定位、物理推理与规划。参与预训练、Chain-of-Point 推理、VLA 与训练基础设施。</p><figure class="project-figure"><button type="button" class="figure-open" data-image-title="RynnBrain 1.0 · 模型架构" data-image-source="https://github.com/alibaba-damo-academy/RynnBrain/blob/rynnbrain1.0/cookbooks/assets/framework.png" aria-haspopup="dialog" aria-controls="image-viewer" aria-label="放大RynnBrain 官方模型架构图"><img src="./research-assets/rynnbrain-framework.png" alt="RynnBrain 官方模型架构图" loading="lazy"><span>查看大图 ↗</span></button><figcaption>RynnBrain 1.0 模型架构 · <a href="https://github.com/alibaba-damo-academy/RynnBrain/blob/rynnbrain1.0/cookbooks/assets/framework.png" target="_blank" rel="noopener noreferrer">原始项目资料 ↗</a></figcaption></figure><div class="links"><a href="https://arxiv.org/html/2602.14979v1#A1" target="_blank" rel="noopener noreferrer">个人贡献说明 ↗</a><a href="https://arxiv.org/abs/2602.14979" target="_blank" rel="noopener noreferrer">论文 ↗</a><a href="https://github.com/alibaba-damo-academy/RynnBrain" target="_blank" rel="noopener noreferrer">代码 ↗</a><a href="https://arxiv.org/abs/2607.17977" target="_blank" rel="noopener noreferrer">RynnBrain 1.1 ↗</a></div></article><article class="project"><p class="en">PHYSICAL INTELLIGENCE</p><h3>WorldVLA</h3><p class="role">共同作者 · Co-author</p><p>统一自回归框架，联合建模机器人动作与未来视觉状态。WorldVLA 是 RynnVLA-002 的前序工作，原仓库现跳转至后继项目。</p><div class="links"><a href="https://arxiv.org/abs/2506.21539" target="_blank" rel="noopener noreferrer">论文 ↗</a><a href="https://github.com/alibaba-damo-academy/WorldVLA" target="_blank" rel="noopener noreferrer">后继共享代码 ↗</a></div></article><article class="project"><p class="en">PHYSICAL INTELLIGENCE</p><h3>RynnVLA-001 / 002</h3><p class="role">共同作者 · Co-author</p><p>001：利用第一人称人类操作视频预训练，将人类示范迁移到机器人控制。</p><p>002：结合连续 Action Transformer、腕部相机与机器人状态，统一视觉语言动作建模与世界建模。</p><div class="links"><a href="https://arxiv.org/abs/2509.15212" target="_blank" rel="noopener noreferrer">001 论文 ↗</a><a href="https://github.com/alibaba-damo-academy/RynnVLA-001" target="_blank" rel="noopener noreferrer">001 代码 ↗</a><a href="https://arxiv.org/abs/2511.17502" target="_blank" rel="noopener noreferrer">002 论文 ↗</a><a href="https://github.com/alibaba-damo-academy/RynnVLA-002" target="_blank" rel="noopener noreferrer">002 代码 ↗</a></div></article><article class="project"><p class="en">OTHER RESEARCH / GRAPH LEARNING</p><h3>JGCF</h3><p>基于 Jacobi 多项式的图协同过滤方法，建模用户与物品之间的图信号。</p><div class="links"><a href="https://arxiv.org/abs/2306.03624" target="_blank" rel="noopener noreferrer">论文 ↗</a><a href="https://github.com/SpaceLearner/JGCF" target="_blank" rel="noopener noreferrer">代码 ↗</a></div></article></template>
